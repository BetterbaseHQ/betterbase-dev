      context: .
      dockerfile: ./betterbase-examples/photos/Dockerfile.dev
    volumes:
      - ./betterbase-examples/photos:/workspace/examples/photos
      - /workspace/examples/photos/node_modules
    ports:
      - "5383:5383"
    environment:
      - ACCOUNTS_URL=http://accounts:5377
      - SYNC_URL=http://sync:5379
      - VITE_DOMAIN=accounts.betterbase.localhost
      - VITE_BASE_PATH=/photos/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5383/"]
      start_period: 20s

  board:
    build:
      context: .
      dockerfile: ./betterbase-examples/board/Dockerfile.dev
    volumes:
      - ./betterbase-examples/board:/workspace/examples/board
      - /workspace/examples/board/node_modules
    ports:
      - "5384:5384"
    environment:
      - ACCOUNTS_URL=http://accounts:5377
      - SYNC_URL=http://sync:5379
      - VITE_DOMAIN=accounts.betterbase.localhost
      - VITE_BASE_PATH=/board/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5384/"]
      start_period: 20s

  passwords:
    build:
      context: .
      dockerfile: ./betterbase-examples/passwords/Dockerfile.dev
    volumes:
      - ./betterbase-examples/passwords:/workspace/examples/passwords
      - /workspace/examples/passwords/node_modules
    ports:
      - "5387:5387"
    environment:
      - ACCOUNTS_URL=http://accounts:5377
      - SYNC_URL=http://sync:5379
      - VITE_DOMAIN=accounts.betterbase.localhost
      - VITE_BASE_PATH=/passwords/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5387/"]
      start_period: 20s

  messenger:
    build:
      context: .
      dockerfile: ./betterbase-examples/messenger/Dockerfile.dev
    volumes:
      - ./betterbase-examples/messenger:/workspace/examples/messenger
      - /workspace/examples/messenger/node_modules
    ports:
      - "5385:5385"
    environment:
      - ACCOUNTS_URL=http://accounts:5377
      - SYNC_URL=http://sync:5379
      - VITE_DOMAIN=accounts.betterbase.localhost
      - VITE_BASE_PATH=/messenger/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5385/"]
      start_period: 20s

  ai-chat:
    build:
      context: .
      dockerfile: ./betterbase-examples/ai-chat/Dockerfile.dev
    volumes:
      - ./betterbase-examples/ai-chat:/workspace/examples/ai-chat
      - /workspace/examples/ai-chat/node_modules
    ports:
      - "5386:5386"
    environment:
      - ACCOUNTS_URL=http://accounts:5377
      - SYNC_URL=http://sync:5379
      - VITE_DOMAIN=accounts.betterbase.localhost
      - VITE_BASE_PATH=/ai-chat/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5386/"]
      start_period: 20s

volumes:
  dev_accounts_db_data:
  dev_sync_db_data:
  dev_sync_files:
  dev_cap_data:
  dev_caddy_data:
  dev_caddy_config:
