# Development overrides — must be explicitly passed with -f (not auto-loaded).
# Uses dev-prefixed volumes so dev-down -v can never delete prod data.
#
# Dev runs the SAME edge as prod: Caddy fronts everything on port 80 with
# prod-shaped origins (*.betterbase.localhost resolve to loopback in
# browsers per RFC 6761 — no DNS setup). See caddy/Caddyfile.dev.
services:
  # Caddy in dev: prod-parity edge (sites, tiers, /cap/*) on loopback port 80
  # only. The 5377/5379/5380 ports from the base file stay dark here — the
  # canonical dev origins are http://accounts.betterbase.localhost etc.
  # Direct service ports below remain published for tooling (curl, just
  # health, debugging), not for browsers.
  caddy:
    ports: !override ["127.0.0.1:80:80"]
    volumes: !override
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - dev_caddy_data:/data
      - dev_caddy_config:/config

  accounts:
    build:
      context: ./betterbase-accounts
      dockerfile: Dockerfile.dev
    volumes:
      - ./betterbase-accounts:/app
      - /app/crates/api/assets
    ports:
      - "5377:5377"
    environment:
      - SMTP_DEV_MODE=true
      - SMTP_FROM=noreply@localhost
      # CAPTCHA runs in dev, exactly as in prod: Caddy's /cap/* tier serves
      # the widget and challenge endpoints on the accounts origin. Keys come
      # from .env (maintained by _ensure-cap-key). The e2e stack keeps CAP
      # disabled: its tests run headless Chromium, which blockAutomatedBrowsers
      # would reject.
      # Prod-shaped origins (see caddy/Caddyfile.dev): the issuer must match
      # the browser-facing accounts origin or OAuth/JWT validation breaks.
      - OAUTH_ISSUER=http://accounts.betterbase.localhost
      - SYNC_ENDPOINT=http://sync.betterbase.localhost/api/v1
      # Use committed .sqlx query cache — DB isn't migrated at compile time
      - SQLX_OFFLINE=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5377/health"]
      start_period: 60s

  accounts-db:
    volumes:
      - dev_accounts_db_data:/var/lib/postgresql/data

  sync:
    build:
      context: ./betterbase-sync
      dockerfile: Dockerfile.dev
    volumes:
      - ./betterbase-sync:/app
      - /app/tmp
      # Redirect the prod files volume (docker-compose.yml) to a dev one so
      # `dev-down -v` can never touch prod blob data (same pattern as the DBs)
      - dev_sync_files:/var/lib/betterbase-sync/files
    ports:
      - "5379:5379"
    environment:
      # Must match the OAUTH_ISSUER override on accounts so JWT issuer validation passes
      - TRUSTED_ISSUERS=http://accounts.betterbase.localhost=http://accounts:5377/.well-known/jwks.json
      # Enable file storage (filesystem-backed in dev)
      - FILE_STORAGE=fs
      - FILE_FS_PATH=/var/lib/betterbase-sync/files
      - SQLX_OFFLINE=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5379/health"]
      start_period: 30s

  sync-db:
    volumes:
      - dev_sync_db_data:/var/lib/postgresql/data

  cap:
    # Published on loopback for the accounts web Vite dev proxy (/cap),
    # which host-side Vite uses when developing the web UI on localhost:5378.
    # The canonical browser route is Caddy's /cap/* tier.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dev_cap_data:/data

  launchpad:
    build:
      context: .
      dockerfile: ./betterbase-examples/launchpad/Dockerfile.dev
    volumes:
      - ./betterbase-examples/launchpad:/workspace/examples/launchpad
      - /workspace/examples/launchpad/node_modules
    ports:
      - "5380:5380"
    environment:
      - ACCOUNTS_URL=http://accounts:5377
      # Prod-shaped origin config: browser apps talk to the Caddy origins,
      # launchpad mounted at / (as in prod)
      - VITE_DOMAIN=accounts.betterbase.localhost
      - VITE_BASE_PATH=/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5380/"]
      start_period: 20s

  tasks:
    build:
      context: .
      dockerfile: ./betterbase-examples/tasks/Dockerfile.dev
    volumes:
      - ./betterbase-examples/tasks:/workspace/examples/tasks
      - /workspace/examples/tasks/node_modules
    ports:
      - "5381:5381"
    environment:
      - ACCOUNTS_URL=http://accounts:5377
      - SYNC_URL=http://sync:5379
      - VITE_DOMAIN=accounts.betterbase.localhost
      - VITE_BASE_PATH=/tasks/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5381/"]
      start_period: 20s

  notes:
    build:
      context: .
      dockerfile: ./betterbase-examples/notes/Dockerfile.dev
    volumes:
      - ./betterbase-examples/notes:/workspace/examples/notes
      - /workspace/examples/notes/node_modules
    ports:
      - "5382:5382"
    environment:
      - ACCOUNTS_URL=http://accounts:5377
      - SYNC_URL=http://sync:5379
      - VITE_DOMAIN=accounts.betterbase.localhost
      - VITE_BASE_PATH=/notes/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5382/"]
      start_period: 20s

  photos:
