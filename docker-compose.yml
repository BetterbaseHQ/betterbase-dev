services:
  # ==========================================================================
  # CAP - Proof-of-Work CAPTCHA
  # ==========================================================================
  cap:
    # Digest-pinned: upstream publishes only a floating :latest tag, and a
    # silent update is what introduced the Redis requirement. Bump
    # deliberately after checking https://github.com/tiagozip/cap releases.
    image: tiago2/cap@sha256:c29417b6270d1fddc6a0603c08d972f89a12de81889d09c3f97a0915422fba5e
    expose:
      - "3000"
    environment:
      - ADMIN_KEY=${CAP_ADMIN_KEY}
      - CORS_ORIGIN=*
      - ENABLE_ASSETS_SERVER=true
      - REDIS_URL=redis://valkey:6379
    volumes:
      - cap_data:/data
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Valkey (Redis-compatible) backing store for CAP
  valkey:
    image: valkey/valkey:9-alpine
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================================================
  # Caddy - Reverse Proxy with Rate Limiting
  # ==========================================================================
  caddy:
    build: ./caddy
    ports:
      # HTTP->HTTPS redirect + ACME HTTP-01 challenge (hostname mode only;
      # dark when the sites are localhost:port HTTP mode)
      - "80:80"
      # Automatic HTTPS (hostname mode only; dark in localhost HTTP mode)
      - "443:443"
      # Localhost HTTP mode (when ACCOUNTS_SITE/SYNC_SITE are unset)
      - "5377:5377"  # accounts (rate-limited)
      - "5379:5379"  # sync (rate-limited)
      - "5380:5380"  # samples (rate-limited)
    environment:
      # Site addresses: unset/":port" serves plain HTTP on that port
      # (local mode); a real hostname switches Caddy to automatic HTTPS on
      # 443 with ACME (Let's Encrypt). See caddy/Caddyfile.
      - ACCOUNTS_SITE=${ACCOUNTS_SITE:-:5377}
      - SYNC_SITE=${SYNC_SITE:-:5379}
      - SAMPLES_SITE=${SAMPLES_SITE:-:5380}
      - ACME_EMAIL=${ACME_EMAIL:-admin@localhost}
    volumes:
      # Config is mounted, not baked: edits apply after `docker compose restart caddy`
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist ACME account + certificates across restarts (without this,
      # every restart re-issues certs and burns Let's Encrypt rate limits)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      accounts:
        condition: service_healthy
      sync:
        condition: service_healthy
    healthcheck:
      # Use dedicated Caddy health endpoint (not proxied to backend)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================================================
  # Samples - hosted example apps (single container, path-based)
  # ==========================================================================
  # Serves the launchpad portal at / and each example app at /<app>/.
  # Client IDs + accounts domain are injected at startup (see entrypoint);
  # setup provisions the OAuth clients (scripts/setup-oauth-client.sh).
  samples:
    image: ghcr.io/betterbasehq/betterbase-examples:latest
    expose:
      - "8080"
    environment:
      - SAMPLES_ACCOUNTS_DOMAIN=${SAMPLES_ACCOUNTS_DOMAIN:-localhost:5377}
      # Space- or comma-separated; launchpad is always served at /
      - ENABLED_APPS=${ENABLED_APPS:-tasks notes photos board chat passwords}
      - LAUNCHPAD_CLIENT_ID=${LAUNCHPAD_CLIENT_ID:-}
      - TASKS_CLIENT_ID=${TASKS_CLIENT_ID:-}
      - NOTES_CLIENT_ID=${NOTES_CLIENT_ID:-}
      - PHOTOS_CLIENT_ID=${PHOTOS_CLIENT_ID:-}
      - BOARD_CLIENT_ID=${BOARD_CLIENT_ID:-}
      - CHAT_CLIENT_ID=${CHAT_CLIENT_ID:-}
      - PASSWORDS_CLIENT_ID=${PASSWORDS_CLIENT_ID:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================================================
  # Databases
  # ==========================================================================
  accounts-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${ACCOUNTS_DB_USER:-accounts}
      - POSTGRES_PASSWORD=${ACCOUNTS_DB_PASSWORD:-accounts}
      - POSTGRES_DB=${ACCOUNTS_DB_NAME:-accounts}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - accounts_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCOUNTS_DB_USER:-accounts} -d ${ACCOUNTS_DB_NAME:-accounts}"]
      interval: 5s
      timeout: 3s
      retries: 5

  accounts:
    build: ./betterbase-accounts
    # Port exposed via Caddy with rate limiting
    expose:
      - "5377"
    environment:
      - OPAQUE_SERVER_SETUP=${OPAQUE_SERVER_SETUP}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-https://accounts.betterbase.dev}
      - DATABASE_URL=postgres://${ACCOUNTS_DB_USER:-accounts}:${ACCOUNTS_DB_PASSWORD:-accounts}@accounts-db:5432/${ACCOUNTS_DB_NAME:-accounts}?sslmode=disable
      - CAP_VERIFY_URL=http://cap:3000
      - CAP_KEY_ID=${CAP_KEY_ID}
      - CAP_SECRET=${CAP_SECRET}
      # Privacy-preserving identity hashing key (HMAC-SHA256)
      - IDENTITY_HASH_KEY=${IDENTITY_HASH_KEY}
      # Sync endpoint advertised in federation discovery metadata.
      # Must be reachable from *browsers* (and federation peers), not just
      # inside the Docker network — for a named deployment set e.g.
      # SYNC_ENDPOINT=https://sync.example.com/api/v1 (matching SYNC_SITE).
      # The localhost default keeps a bare local prod stack consistent.
      - SYNC_ENDPOINT=${SYNC_ENDPOINT:-http://localhost:5379/api/v1}
      # Email delivery (SMTP_DEV_MODE=false in prod → real SMTP). The server
      # fails fast at startup if SMTP_HOST is empty in SMTP mode.
      - SMTP_DEV_MODE=${SMTP_DEV_MODE:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@betterbase.dev}
    depends_on:
      accounts-db:
        condition: service_healthy
      cap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5377/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  sync-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${SYNC_DB_USER:-sync}
      - POSTGRES_PASSWORD=${SYNC_DB_PASSWORD:-sync}
      - POSTGRES_DB=${SYNC_DB_NAME:-sync}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - sync_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNC_DB_USER:-sync} -d ${SYNC_DB_NAME:-sync}"]
      interval: 5s
      timeout: 3s
      retries: 5

  sync:
    build: ./betterbase-sync
    # Port exposed via Caddy with rate limiting
    expose:
      - "5379"
    environment:
      # PostgreSQL connection
      - DATABASE_URL=postgres://${SYNC_DB_USER:-sync}:${SYNC_DB_PASSWORD:-sync}@sync-db:5432/${SYNC_DB_NAME:-sync}?sslmode=disable
      # JWT auth - trusted accounts servers (issuer=jwks_url for internal networking)
      - TRUSTED_ISSUERS=${OAUTH_ISSUER:-https://accounts.betterbase.dev}=http://accounts:5377/.well-known/jwks.json
      - AUDIENCES=betterbase-sync
      # Privacy-preserving rate limit identity hashing (matches accounts)
      - IDENTITY_HASH_KEY=${IDENTITY_HASH_KEY}
      # Blob/file storage: filesystem backend on a named volume, matching
      # dev and e2e parity. Set FILE_STORAGE=none to disable file routes.
      - FILE_STORAGE=${FILE_STORAGE:-fs}
      - FILE_FS_PATH=/var/lib/betterbase-sync/files
    volumes:
      - sync_files:/var/lib/betterbase-sync/files
    depends_on:
      accounts:
        condition: service_healthy
      sync-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5379/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cap_data:
  valkey_data:
  caddy_data:
  caddy_config:
  accounts_db_data:
  sync_db_data:
  sync_files:
