[package]
name = "compression-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Feature parity with production: betterbase-db-wasm (the shipped SDK) builds
# betterbase-db with `default-features = false, features = ["js"]`. Both
# features are irrelevant to the CRDT codec — `sqlite` gates rusqlite storage,
# `js` gates uuid's wasm backend (this bench passes explicit session ids and
# never generates uuids) — so model binaries here are byte-identical to what
# production produces.
#
# Numbers in README.md were recorded against sibling checkouts at:
#   betterbase   8d45e97
#   json-joy-rs  410e199
# (Path deps track whatever is checked out; re-record if those move.)

[dependencies]
betterbase-db = { path = "../betterbase/crates/betterbase-db", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
zstd = "0.14"
