# Standalone E2E test stack — completely isolated from the dev and prod
# compose projects:
#   - Own project name (`betterbase-e2e`): separate containers, network, and
#     volume namespace. Dev (`just dev`) and e2e can run concurrently; no e2e
#     command can touch dev containers or vice versa.
#   - Distinct host ports: 25377 (accounts), 25379 (sync), 25387 (accounts-b),
#     25389 (sync-b). The Playwright test harness (vite) serves on 25390.
#   - No caddy/cap/examples: rate limiting and CAPTCHA are not under test.
#
# Interpolation vars come from two env files (passed via --env-file by the
# justfile recipes):
#   .env             — root secrets shared with dev/prod (OPAQUE_SERVER_SETUP,
#                      IDENTITY_HASH_KEY, DB creds)
#   e2e/.env.docker  — e2e-only runtime config (Server B OPAQUE key, federation
#                      trusted keys), written by `just e2e-up`/`just e2e-setup`,
#                      gitignored
#
# Server B (accounts-b/sync-b) is a federation peer for federation.spec.ts.
name: betterbase-e2e

services:
  # ===========================================================================
  # Server A
  # ===========================================================================
  accounts-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${ACCOUNTS_DB_USER:-accounts}
      - POSTGRES_PASSWORD=${ACCOUNTS_DB_PASSWORD:-accounts}
      - POSTGRES_DB=${ACCOUNTS_DB_NAME:-accounts}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - accounts_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCOUNTS_DB_USER:-accounts} -d ${ACCOUNTS_DB_NAME:-accounts}"]
      interval: 5s
      timeout: 3s
      retries: 5

  accounts:
    build: ./betterbase-accounts
    ports:
      - "25377:5377"
    environment:
      - OPAQUE_SERVER_SETUP=${OPAQUE_SERVER_SETUP}
      # Browser-reachable issuer (must match TRUSTED_ISSUERS in both sync servers)
      - OAUTH_ISSUER=http://localhost:25377
      - DATABASE_URL=postgres://${ACCOUNTS_DB_USER:-accounts}:${ACCOUNTS_DB_PASSWORD:-accounts}@accounts-db:5432/${ACCOUNTS_DB_NAME:-accounts}?sslmode=disable
      # CAPTCHA disabled in e2e (CAP only activates when CAP_KEY_ID is set)
      - CAP_KEY_ID=
      - CAP_SECRET=
      - IDENTITY_HASH_KEY=${IDENTITY_HASH_KEY}
      # Discovery must return browser-reachable URLs
      - SYNC_ENDPOINT=http://localhost:25379/api/v1
      # Federation: advertise s2s WS endpoint (internal Docker URL for s2s peers)
      - FEDERATION_WS_ENDPOINT=ws://sync:5379/api/v1/federation/ws
      - SMTP_DEV_MODE=true
      - SMTP_FROM=noreply@localhost
    depends_on:
      accounts-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5377/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  sync-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${SYNC_DB_USER:-sync}
      - POSTGRES_PASSWORD=${SYNC_DB_PASSWORD:-sync}
      - POSTGRES_DB=${SYNC_DB_NAME:-sync}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - sync_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNC_DB_USER:-sync} -d ${SYNC_DB_NAME:-sync}"]
      interval: 5s
      timeout: 3s
      retries: 5

  sync:
    build: ./betterbase-sync
    ports:
      - "25379:5379"
    environment:
      - DATABASE_URL=postgres://${SYNC_DB_USER:-sync}:${SYNC_DB_PASSWORD:-sync}@sync-db:5432/${SYNC_DB_NAME:-sync}?sslmode=disable
      # Trust both accounts servers (Server A + Server B)
      - TRUSTED_ISSUERS=http://localhost:25377=http://accounts:5377/.well-known/jwks.json http://localhost:25387=http://accounts-b:5377/.well-known/jwks.json
      - AUDIENCES=betterbase-sync
      - IDENTITY_HASH_KEY=${IDENTITY_HASH_KEY}
      - FILE_STORAGE=fs
      - FILE_FS_PATH=/var/lib/betterbase-sync/files
      # Federation: signing key auto-provisioned on first boot (stable across
      # restarts); peer trust injected via e2e/.env.docker by `just e2e-setup`
      - FEDERATION_DOMAIN=sync:5379
      - FEDERATION_TRUSTED_DOMAINS=sync-b
      - FEDERATION_TRUSTED_KEYS=${FEDERATION_TRUSTED_KEYS_A:-}
      - FEDERATION_FST_SECRET=${SPACE_SESSION_SECRET:-e2e-fst-secret}
    depends_on:
      accounts:
        condition: service_healthy
      sync-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5379/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # Server B (federation peer)
  # ===========================================================================
  accounts-db-b:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${ACCOUNTS_DB_USER:-accounts}
      - POSTGRES_PASSWORD=${ACCOUNTS_DB_PASSWORD:-accounts}
      - POSTGRES_DB=${ACCOUNTS_DB_NAME:-accounts}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - accounts_db_b_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCOUNTS_DB_USER:-accounts} -d ${ACCOUNTS_DB_NAME:-accounts}"]
      interval: 5s
      timeout: 3s
      retries: 5

  accounts-b:
    build: ./betterbase-accounts
    ports:
      - "25387:5377"
    environment:
      - OPAQUE_SERVER_SETUP=${OPAQUE_SERVER_SETUP_B:-}
      - OAUTH_ISSUER=http://localhost:25387
      - DATABASE_URL=postgres://${ACCOUNTS_DB_USER:-accounts}:${ACCOUNTS_DB_PASSWORD:-accounts}@accounts-db-b:5432/${ACCOUNTS_DB_NAME:-accounts}?sslmode=disable
      - CAP_KEY_ID=
      - CAP_SECRET=
      - IDENTITY_HASH_KEY=${IDENTITY_HASH_KEY}
      - SYNC_ENDPOINT=http://localhost:25389/api/v1
      - FEDERATION_WS_ENDPOINT=ws://sync-b:5379/api/v1/federation/ws
      - SMTP_DEV_MODE=true
      - SMTP_FROM=noreply@localhost
    depends_on:
      accounts-db-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5377/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  sync-db-b:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${SYNC_DB_USER:-sync}
      - POSTGRES_PASSWORD=${SYNC_DB_PASSWORD:-sync}
      - POSTGRES_DB=${SYNC_DB_NAME:-sync}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - sync_db_b_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNC_DB_USER:-sync} -d ${SYNC_DB_NAME:-sync}"]
      interval: 5s
      timeout: 3s
      retries: 5

  sync-b:
    build: ./betterbase-sync
    ports:
      - "25389:5379"
    environment:
      - DATABASE_URL=postgres://${SYNC_DB_USER:-sync}:${SYNC_DB_PASSWORD:-sync}@sync-db-b:5432/${SYNC_DB_NAME:-sync}?sslmode=disable
      # Trust both accounts servers (Server A + Server B)
      - TRUSTED_ISSUERS=http://localhost:25377=http://accounts:5377/.well-known/jwks.json http://localhost:25387=http://accounts-b:5377/.well-known/jwks.json
      - AUDIENCES=betterbase-sync
      - FILE_STORAGE=fs
      - FILE_FS_PATH=/var/lib/betterbase-sync/files
      - FEDERATION_DOMAIN=sync-b:5379
      - FEDERATION_TRUSTED_DOMAINS=sync
      - FEDERATION_TRUSTED_KEYS=${FEDERATION_TRUSTED_KEYS_B:-}
      - FEDERATION_FST_SECRET=${SPACE_SESSION_SECRET:-e2e-fst-secret}
    depends_on:
      accounts-b:
        condition: service_healthy
      sync-db-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5379/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  accounts_db_data:
  sync_db_data:
  accounts_db_b_data:
  sync_db_b_data:
